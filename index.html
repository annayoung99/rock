function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}
const COL=['#ff3344','#ff8822','#ffdd33','#22dd66','#33aaff','#aa44ff'];
function isLatin(s){return /^[\x00-\x7F\s'.,&!?\-]+$/.test(s);}

function gen(t,a){
const h1=hash(a),h2=hash(t),c1=COL[h1%6],c2=COL[(h1+3)%6],v=(h1+h2)%6;
let i='';
if(v===0)i=`<polygon points="50,20 76,72 24,72" fill="none" stroke="${c1}" stroke-width="1"/><line x1="12" y1="50" x2="50" y2="50" stroke="#fff" stroke-width="0.8"/><line x1="60" y1="50" x2="90" y2="38" stroke="${c1}" stroke-width="0.8"/><line x1="60" y1="50" x2="92" y2="50" stroke="${c2}" stroke-width="0.8"/><line x1="60" y1="50" x2="90" y2="62" stroke="${COL[(h1+5)%6]}" stroke-width="0.8"/>`;
else if(v===1){let r='';for(let k=0;k<5;k++){r+=`<circle cx="50" cy="50" r="${38-k*7}" fill="none" stroke="${c1}" stroke-width="0.5" opacity="${0.9-k*0.12}"/>`;}r+=`<circle cx="50" cy="50" r="3" fill="${c2}"/>`;i=r;}
else if(v===2)i=`<circle cx="50" cy="50" r="32" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.4"/><path d="M 50 18 A 32 32 0 0 1 50 82 A ${20+h2%12} 32 0 0 0 50 18" fill="${c1}" opacity="0.7"/>`;
else if(v===3)i=`<line x1="18" y1="50" x2="82" y2="50" stroke="${c1}" stroke-width="0.5" opacity="0.6"/><line x1="50" y1="18" x2="50" y2="82" stroke="${c1}" stroke-width="0.5" opacity="0.6"/><line x1="28" y1="28" x2="72" y2="72" stroke="${c2}" stroke-width="0.5" opacity="0.4"/><line x1="28" y1="72" x2="72" y2="28" stroke="${c2}" stroke-width="0.5" opacity="0.4"/><circle cx="50" cy="50" r="5" fill="${c1}"/><circle cx="30" cy="30" r="1.2" fill="#fff"/><circle cx="70" cy="30" r="1.2" fill="#fff"/><circle cx="30" cy="70" r="1.2" fill="#fff"/><circle cx="70" cy="70" r="1.2" fill="#fff"/>`;
else if(v===4){let p1='M 15 50',p2='M 15 60',p3='M 15 40';for(let x=15;x<=95;x+=5){let y1=50+8*Math.sin((x+h2%20)/6);let y2=60+5*Math.sin((x+h2%15)/5+1);let y3=40+5*Math.sin((x+h2%15)/5+2);p1+=` L ${x} ${y1}`;p2+=` L ${x} ${y2}`;p3+=` L ${x} ${y3}`;}i=`<path d="${p1}" fill="none" stroke="${c1}" stroke-width="0.8"/><path d="${p2}" fill="none" stroke="${c2}" stroke-width="0.6" opacity="0.7"/><path d="${p3}" fill="none" stroke="${c2}" stroke-width="0.6" opacity="0.7"/>`;}
else i=`<rect x="28" y="28" width="44" height="44" fill="none" stroke="${c1}" stroke-width="0.8" transform="rotate(${h2%45} 50 50)"/><rect x="34" y="34" width="32" height="32" fill="none" stroke="${c2}" stroke-width="0.8" transform="rotate(${-(h2%30)} 50 50)"/><circle cx="50" cy="50" r="5" fill="${c1}"/>`;
return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#000"/>${i}<rect x="0" y="0" width="100" height="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></svg>`;
}

function fitText(ctx,text,maxWidth,baseFontSize,fontFamily,minFontSize){
let fontSize=baseFontSize;
while(fontSize>=minFontSize){
ctx.font=`500 ${fontSize}px ${fontFamily}`;
if(ctx.measureText(text).width<=maxWidth)return fontSize;
fontSize-=2;
}
return minFontSize;
}

function wrapText(ctx,text,maxWidth){
const isCN=/[\u4e00-\u9fa5]/.test(text);
const lines=[];
if(isCN){
let cur='';
for(let ch of text){
const test=cur+ch;
if(ctx.measureText(test).width>maxWidth&&cur){lines.push(cur);cur=ch;}
else cur=test;
}
if(cur)lines.push(cur);
}else{
const words=text.split(' ');
let cur='';
for(let w of words){
const test=cur?cur+' '+w:w;
if(ctx.measureText(test).width>maxWidth&&cur){lines.push(cur);cur=w;}
else cur=test;
}
if(cur)lines.push(cur);
}
return lines;
}
