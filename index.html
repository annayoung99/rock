function hash(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return Math.abs(h);}
const COLORS=['#ff2222','#ff8800','#ffdd00','#00dd44','#0088ff','#8833ff','#ee44aa','#22ddcc'];
function genCover(title,artist){
const h1=hash(artist),h2=hash(title);
const c1=COLORS[h1%COLORS.length],c2=COLORS[(h1+3)%COLORS.length];
const variant=(h1+h2)%6;
let inner='';
if(variant===0){inner=`<polygon points="50,18 78,72 22,72" fill="none" stroke="${c1}" stroke-width="1.2"/><line x1="10" y1="50" x2="50" y2="50" stroke="#fff" stroke-width="0.8"/><line x1="60" y1="50" x2="90" y2="38" stroke="${c1}" stroke-width="0.8"/><line x1="60" y1="50" x2="92" y2="50" stroke="${c2}" stroke-width="0.8"/><line x1="60" y1="50" x2="90" y2="62" stroke="${COLORS[(h1+5)%8]}" stroke-width="0.8"/>`;}
else if(variant===1){inner=`<circle cx="50" cy="50" r="38" fill="none" stroke="${c1}" stroke-width="0.6"/><circle cx="50" cy="50" r="30" fill="none" stroke="${c2}" stroke-width="0.6"/><circle cx="50" cy="50" r="22" fill="none" stroke="${c1}" stroke-width="0.6" opacity="0.7"/><circle cx="50" cy="50" r="14" fill="${c2}" opacity="0.3"/><circle cx="50" cy="50" r="3" fill="${c1}"/>`;}
else if(variant===2){inner=`<circle cx="50" cy="50" r="32" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/><circle cx="50" cy="50" r="32" fill="${c1}" opacity="0.15"/><path d="M 50 18 A 32 32 0 0 1 50 82 A 22 32 0 0 0 50 18" fill="${c1}" opacity="0.6"/>`;}
else if(variant===3){inner=`<line x1="20" y1="50" x2="80" y2="50" stroke="${c1}" stroke-width="0.5" opacity="0.6"/><line x1="50" y1="20" x2="50" y2="80" stroke="${c1}" stroke-width="0.5" opacity="0.6"/><line x1="28" y1="28" x2="72" y2="72" stroke="${c2}" stroke-width="0.5" opacity="0.4"/><line x1="28" y1="72" x2="72" y2="28" stroke="${c2}" stroke-width="0.5" opacity="0.4"/><circle cx="50" cy="50" r="6" fill="${c1}"/><circle cx="30" cy="30" r="1.5" fill="#fff"/><circle cx="70" cy="30" r="1.5" fill="#fff"/><circle cx="30" cy="70" r="1.5" fill="#fff"/><circle cx="70" cy="70" r="1.5" fill="#fff"/>`;}
else if(variant===4){inner=`<path d="M 15 50 Q 25 ${30+h2%20}, 35 50 T 55 50 T 75 50 T 95 50" fill="none" stroke="${c1}" stroke-width="1"/><path d="M 15 60 Q 25 ${40+h2%15}, 35 60 T 55 60 T 75 60 T 95 60" fill="none" stroke="${c2}" stroke-width="0.8" opacity="0.7"/><path d="M 15 40 Q 25 ${20+h2%15}, 35 40 T 55 40 T 75 40 T 95 40" fill="none" stroke="${c2}" stroke-width="0.8" opacity="0.7"/>`;}
else{inner=`<rect x="25" y="25" width="50" height="50" fill="none" stroke="${c1}" stroke-width="0.8" transform="rotate(${h2%45} 50 50)"/><rect x="32" y="32" width="36" height="36" fill="none" stroke="${c2}" stroke-width="0.8" transform="rotate(${-(h2%30)} 50 50)"/><circle cx="50" cy="50" r="6" fill="${c1}"/>`;}
return `<svg viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="#000"/>${inner}</svg>`;
}
