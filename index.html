<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:#000;color:#e8e2d4;font-family:'Noto Sans SC',-apple-system,sans-serif;user-select:none;position:relative;overflow-x:hidden;font-weight:300}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -12%,rgba(255,255,255,.08),transparent 30%),linear-gradient(115deg,transparent 0 61%,rgba(255,48,72,.09) 61%,rgba(255,136,34,.07) 66%,rgba(255,221,51,.06) 71%,rgba(34,221,102,.055) 76%,rgba(51,170,255,.065) 82%,rgba(170,68,255,.075) 88%,transparent 88%);opacity:.72}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px,42px 42px;mask-image:radial-gradient(circle at center,#000 0,transparent 82%);opacity:.55}

.c{position:relative;z-index:2;min-height:100vh;padding:22px 18px 30px;display:flex;flex-direction:column;max-width:480px;margin:0 auto;width:100%}

.h{text-align:center;margin-bottom:8px;padding-top:8px}
.tag{display:inline-block;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:4px;color:#8e887c;margin-bottom:14px}
.t{font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,13vw,72px);line-height:.9;letter-spacing:7px;color:#fff;margin-right:-7px;font-weight:400;text-shadow:0 0 28px rgba(255,255,255,.16)}
.sb{font-family:'Noto Sans SC',sans-serif;font-size:12px;letter-spacing:.8px;color:#b7aa95;margin-top:12px;font-weight:300}
.sb .em{display:block;color:#fff;font-family:'Bebas Neue',sans-serif;letter-spacing:3px;font-size:17px;margin-top:4px}

.modes{display:flex;justify-content:center;margin:20px 0 0;border:1px solid #2b2925;background:rgba(255,255,255,.03)}
.mb{flex:1;padding:13px 4px;background:transparent;color:#8f897e;border:none;font-family:'Bebas Neue','Noto Sans SC',sans-serif;font-size:14px;letter-spacing:2px;border-right:1px solid #2b2925;cursor:pointer}
.mb:last-child{border-right:none}
.mb.active{color:#070707;background:#e8e2d4}

.filters{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch;display:none}
.filters::-webkit-scrollbar{display:none}
.fp{flex:0 0 auto;padding:7px 14px;background:rgba(255,255,255,.02);color:#9d9688;border:1px solid #332f28;font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.5px;white-space:nowrap;font-weight:300;cursor:pointer}
.fp.active{color:#080808;background:#e8e2d4;border-color:#e8e2d4;font-weight:400}

.prism-wrap{display:flex;justify-content:center;margin:22px 0 8px;position:relative}
.prism-svg{width:100%;max-width:360px;height:120px}

.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;margin:8px 0;min-height:370px}

.song-card{width:100%;border:1px solid #3a352c;padding:26px 20px 24px;text-align:center;background:linear-gradient(180deg,rgba(20,20,18,.92),rgba(0,0,0,.78));box-shadow:0 22px 70px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.03);position:relative}
.song-card::before{content:'ROLL A SONG';position:absolute;left:18px;top:14px;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:11px;color:#7b7469}
.song-card::after{content:'RESET THE DAY';position:absolute;right:18px;bottom:14px;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:11px;color:#7b7469}
.cover{width:156px;height:156px;margin:14px auto 18px;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 0 0 10px rgba(255,255,255,.025),0 0 0 1px rgba(255,255,255,.14)}
.cover svg{width:100%;height:100%}
.song-title{font-family:'Noto Serif SC','Noto Sans SC',sans-serif;font-weight:600;font-size:clamp(20px,5.2vw,27px);color:#fff;letter-spacing:.5px;margin-bottom:9px;line-height:1.28;padding:0 4px;word-break:break-word}
.song-artist{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:4px;color:#d6cdbd;text-transform:uppercase}
.song-artist.cn{font-family:'Noto Sans SC',sans-serif;font-size:13px;letter-spacing:1px;text-transform:none;font-weight:400}
.song-cn-artist{font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.8px;color:#9d9688;font-weight:300;margin-top:4px}
.song-year{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:3px;color:#7b7469;margin-top:7px}
.idle .song-title{color:#888;font-weight:300}
.idle .cover{opacity:.5}

.cal-view{display:none;width:100%;border:1px solid rgba(232,226,212,.22);padding:24px 22px 26px;background:linear-gradient(180deg,rgba(18,18,16,.86),rgba(0,0,0,.66));position:relative;color:#e8e2d4;box-shadow:0 28px 90px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.035)}
.cal-view::before{content:'OFFBEAT DAILY LYRIC';position:absolute;top:12px;left:16px;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;color:rgba(232,226,212,.48)}
.cal-view::after{content:'';position:absolute;left:0;right:0;top:42px;border-top:1px dashed rgba(232,226,212,.16)}
.cal-view.show{display:block}
.cal-date{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:4px;color:rgba(232,226,212,.52);margin:34px 0 6px;text-align:center}
.cal-day{font-family:'Bebas Neue',sans-serif;font-size:clamp(92px,25vw,124px);color:#fff;line-height:.82;letter-spacing:-1px;text-align:center;text-shadow:0 0 34px rgba(255,255,255,.12)}
.cal-month{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:5px;color:rgba(232,226,212,.52);margin:9px 0 30px;text-align:center}
.cal-quote-wrap{position:relative;padding:18px 16px 18px 20px;margin-bottom:22px;background:rgba(232,226,212,.075);border:1px solid rgba(232,226,212,.08);border-left:0}
.cal-quote-wrap::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,#ff3344,#ff8822,#ffdd33,#22dd66,#33aaff,#aa44ff)}
.cal-quote{font-family:'Caveat',cursive;font-size:clamp(26px,7vw,34px);line-height:1.18;color:#fff;font-weight:700;letter-spacing:.2px;min-height:48px;text-align:left}
.cal-quote.cn{font-family:'Noto Serif SC','Noto Sans SC',sans-serif;font-style:normal;font-weight:600;font-size:clamp(20px,5.2vw,27px);line-height:1.68;letter-spacing:.2px}
.cal-from{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;color:rgba(232,226,212,.86);margin-bottom:5px;text-align:center;padding-top:4px}
.cal-from-cn{font-family:'Noto Sans SC',sans-serif;font-size:12px;letter-spacing:.5px;color:rgba(232,226,212,.52);font-weight:300;text-align:center}

.test-view{display:none;width:100%;border:1px solid rgba(232,226,212,.22);padding:84px 18px 24px;background:#000;position:relative;color:#e8e2d4;box-shadow:0 28px 90px rgba(0,0,0,.74),inset 0 0 0 1px rgba(255,255,255,.035);overflow:hidden}
.test-view.show{display:block}
.test-view::before{content:'OFFBEAT';position:absolute;left:16px;top:4px;font-family:'Bebas Neue',sans-serif;font-size:74px;letter-spacing:8px;color:rgba(255,255,255,.052);line-height:1;pointer-events:none;z-index:0}
.test-view::after{content:'';position:absolute;left:0;right:-28px;top:48px;height:34px;background:linear-gradient(96deg,transparent 0 43%,rgba(255,255,255,.75) 43% 44%,transparent 44% 48%,#ff253b 48% 56%,#ff7a1a 56% 63%,#ffd92d 63% 70%,#20d66b 70% 77%,#25a9ff 77% 84%,#9c45ff 84% 94%,transparent 94%);opacity:.78;filter:blur(.25px);clip-path:polygon(0 44%,47% 18%,100% 0,100% 100%,47% 74%,0 56%);pointer-events:none;z-index:0}
.test-view>*{position:relative;z-index:1}
.test-kicker{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:4px;color:#d9b95f;margin-bottom:10px;text-transform:uppercase}
.test-title{font-family:'Bebas Neue','Noto Sans SC',sans-serif;font-size:clamp(37px,9.5vw,56px);line-height:.96;color:#fff;font-weight:400;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase;text-shadow:0 0 24px rgba(255,255,255,.16)}
.test-copy{font-size:13px;line-height:2;color:rgba(232,226,212,.7);letter-spacing:.4px}
.test-progress{height:3px;background:rgba(232,226,212,.1);margin:18px 0;border:1px solid rgba(232,226,212,.08)}
.test-progress span{display:block;height:100%;background:linear-gradient(90deg,#ff253b,#ff7a1a,#ffd92d,#20d66b,#25a9ff,#9c45ff);width:0;transition:width .25s ease;box-shadow:0 0 20px rgba(51,170,255,.35)}
.test-options{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.test-option{width:100%;text-align:left;padding:13px 14px;background:rgba(255,255,255,.025);border:1px solid rgba(232,226,212,.16);color:#eee6d8;font-family:'Noto Sans SC',sans-serif;font-size:13px;line-height:1.55;letter-spacing:.3px;cursor:pointer;position:relative}
.test-option::before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:linear-gradient(to bottom,#ff253b,#ffd92d,#25a9ff,#9c45ff);opacity:.7}
.test-option:active{background:#e8e2d4;color:#050505}
.test-result-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:4px;color:#d9b95f;margin-bottom:12px}
.test-result-title{font-family:'Bebas Neue','Noto Sans SC',sans-serif;font-size:clamp(42px,10vw,62px);line-height:.98;color:#fff;font-weight:400;letter-spacing:1px;margin-bottom:12px;text-shadow:0 0 24px rgba(255,255,255,.14)}
.test-result-line{font-family:'Noto Sans SC',sans-serif;font-size:19px;line-height:1.7;color:#d9b95f;margin-bottom:18px;font-weight:500}
.test-tags{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0 18px}
.test-tag{border:1px solid rgba(232,226,212,.24);padding:6px 9px;font-size:12px;color:#eee6d8;background:rgba(255,255,255,.03)}
.test-near{font-size:12px;line-height:1.8;color:rgba(232,226,212,.62);border-top:1px solid rgba(232,226,212,.14);border-bottom:1px solid rgba(232,226,212,.14);padding:13px 0;margin:14px 0}
.test-bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;margin:18px 0}
.test-bars span{font-size:12px;color:rgba(232,226,212,.62)}
.test-bar{height:11px;border:1px solid rgba(232,226,212,.18);background:#050505;overflow:hidden}
.test-bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#35a9c8 0 16px,#e7c44a 16px 24px,#f04535 24px 39px,#35a9c8 39px 54px);width:50%}
.test-note{font-size:14px;line-height:2.05;color:#f0eadf;letter-spacing:.4px;border-top:1px solid rgba(232,226,212,.14);padding-top:18px}

.cl{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.sp{width:100%;padding:18px;background:#e8e2d4;color:#050505;border:1px solid #e8e2d4;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:9px;text-indent:9px;cursor:pointer;transition:all .15s}
.sp:active{color:#fff;background:#050505}
.sp:disabled{color:#444;border-color:#333}
.ar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ar.hidden{display:none}
.ab{padding:13px 4px;background:rgba(255,255,255,.02);color:#b9ad9c;border:1px solid #3a352d;font-family:'Noto Sans SC',sans-serif;font-size:12px;letter-spacing:.8px;cursor:pointer;font-weight:300}
.ab:active{background:#e8e2d4;color:#000;border-color:#e8e2d4}
.ab:disabled{color:#333;border-color:#222}

.lm{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(8px)}
.lm.s{display:flex}
.lc{width:100%;max-width:420px;background:#0a0a0a;border:1px solid #333;padding:36px 22px 26px;position:relative;text-align:center}
.lx{position:absolute;top:8px;right:14px;background:none;border:none;color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lt{font-family:'Noto Sans SC',sans-serif;font-size:22px;font-weight:500;color:#fff;margin-bottom:6px}
.la{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:5px;color:#888;margin-bottom:22px}
.lr{font-size:13px;line-height:2;white-space:pre-line;color:#aaa;letter-spacing:1px}

.sm{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column}
.sm.s{display:flex}
.sm canvas{max-width:100%;max-height:72vh;border:1px solid #333}
.sm-hint{margin-top:14px;color:#888;font-family:'Noto Sans SC',sans-serif;font-size:12px;letter-spacing:2px;text-align:center;line-height:1.8;font-weight:300}
.sm-close{position:absolute;top:16px;right:16px;background:none;border:1px solid #444;color:#fff;width:36px;height:36px;font-size:22px;cursor:pointer}

.ft{text-align:center;margin-top:18px;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:3px;color:#625b50}

@keyframes pulse{0%,100%{opacity:.92}50%{opacity:1}}
.spinning .ray,.spinning .beam{animation:pulse .15s infinite}
@keyframes spin-cover{0%{transform:rotate(0) scale(.9);opacity:.3}100%{transform:rotate(360deg) scale(1);opacity:1}}
.cover.reveal{animation:spin-cover .6s ease-out}
@keyframes fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.song-card.reveal,.cal-view.reveal{animation:fade-in .5s ease-out}

@media (max-width:359px){
.c{padding:18px 14px 24px}
.t{font-size:42px;letter-spacing:5px;margin-right:-5px}
.cover{width:128px;height:128px}
.sp{padding:16px;font-size:22px;letter-spacing:10px;text-indent:10px}
.ab{padding:11px 2px;font-size:11px;letter-spacing:1.5px}
}

@media (min-width:768px) and (max-width:1023px){
.c{max-width:560px;padding-top:50px}
.prism-svg{max-width:430px;height:140px}
.t{font-size:82px;letter-spacing:10px;margin-right:-10px}
.cover{width:172px;height:172px}
}

@media (min-width:1024px){
body{display:flex;align-items:center;justify-content:center;padding:40px 0}
.c{max-width:1120px;flex-direction:row;gap:68px;align-items:stretch;padding:40px}
.left-panel{flex:0 0 480px;display:flex;flex-direction:column;justify-content:center}
.right-panel{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:380px}
.h{text-align:left;margin-bottom:0}
.t{font-size:96px;letter-spacing:14px;margin-right:-14px}
.sb{text-align:left}
.tag{display:block;text-align:left}
.modes{margin:30px 0 0}
.mb{flex:0 0 auto;padding:11px 28px}
.filters{padding-top:18px;justify-content:flex-start}
.prism-wrap{margin:50px 0 0;justify-content:flex-start}
.prism-svg{max-width:460px;height:160px}
.stage-wrap{min-height:auto;margin:0}
.cover{width:200px;height:200px}
.song-title{font-size:30px}
.cal-day{font-size:150px}
.ft{text-align:left;padding-top:24px}
}
</style></head>
<body>
<div class="c">

<div class="left-panel">

<header class="h">
<span class="tag">— 33 1/3 RPM · SIDE B —</span>
<h1 class="t">OFFBEAT</h1>
<p class="sb"><span class="em">ROLL A SONG, RESET THE DAY</span>每天一句经典摇滚歌词</p>
</header>

<div class="modes">
<button class="mb" data-mode="roulette">ROLL</button>
<button class="mb active" data-mode="calendar">每日摇滚签</button>
<button class="mb" data-mode="test">滚格测试</button>
</div>

<div class="filters" id="filters">
<button class="fp active" data-pool="all">全部</button>
<button class="fp" data-pool="rock_cn">中文摇滚</button>
<button class="fp" data-pool="rock_west">西方摇滚</button>
</div>

<div class="prism-wrap">
<svg class="prism-svg" viewBox="0 0 360 120" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="beamG" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/>
<stop offset="100%" stop-color="#fff" stop-opacity="1"/>
</linearGradient>
<linearGradient id="rainbowG" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="90">
<stop offset="0%" stop-color="#ff253b"/>
<stop offset="15%" stop-color="#ff253b"/>
<stop offset="18%" stop-color="#ff7a1a"/>
<stop offset="31%" stop-color="#ff7a1a"/>
<stop offset="34%" stop-color="#ffd92d"/>
<stop offset="47%" stop-color="#ffd92d"/>
<stop offset="50%" stop-color="#20d66b"/>
<stop offset="63%" stop-color="#20d66b"/>
<stop offset="66%" stop-color="#25a9ff"/>
<stop offset="79%" stop-color="#25a9ff"/>
<stop offset="82%" stop-color="#9c45ff"/>
<stop offset="100%" stop-color="#9c45ff"/>
</linearGradient>
<filter id="softblur" x="-25%" y="-60%" width="150%" height="220%">
<feGaussianBlur stdDeviation="0.65"/>
</filter>
<filter id="prismGlow" x="-45%" y="-45%" width="190%" height="190%">
<feGaussianBlur stdDeviation="1.2"/>
</filter>
</defs>
<g class="beam">
<line x1="-12" y1="85" x2="155" y2="50" stroke="url(#beamG)" stroke-width="2.6" filter="url(#softblur)" opacity=".78"/>
<line x1="-12" y1="85" x2="155" y2="50" stroke="#fff" stroke-width="1.05" opacity=".96"/>
</g>
<g class="ray">
<polygon points="198,49 366,31 366,89 198,64" fill="url(#rainbowG)" filter="url(#softblur)" opacity=".42"/>
<polygon points="198,49 366,31 366,89 198,64" fill="url(#rainbowG)" opacity=".96"/>
<path d="M198 49 L366 31 M198 64 L366 89" stroke="rgba(255,255,255,.22)" stroke-width=".45" opacity=".45"/>
</g>
<polygon points="168,18 216,92 119,92" fill="#050505" stroke="#b8f6f0" stroke-width="3.6" opacity=".32" filter="url(#prismGlow)"/>
<polygon points="168,18 216,92 119,92" fill="#050505" stroke="#e8ffff" stroke-width="1.35" opacity=".9"/>
<path d="M168 18 L156 51 L119 92 M168 18 L190 57 L216 92" fill="none" stroke="#7ce7df" stroke-width=".65" opacity=".32"/>
<line x1="155" y1="50" x2="168" y2="18" stroke="#e8ffff" stroke-width=".45" opacity=".36"/>
<line x1="168" y1="18" x2="198" y2="49" stroke="#e8ffff" stroke-width=".45" opacity=".34"/>
</svg>
</div>

</div>

<div class="right-panel">

<div class="stage-wrap">
<div id="rouletteView" style="width:100%;display:none">
<div class="song-card idle" id="card">
<div class="cover" id="cover">
<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#000"/><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/><circle cx="50" cy="50" r="4" fill="#fff" opacity="0.4"/></svg>
</div>
<div class="song-title" id="title">准备就绪</div>
<div class="song-artist" id="artist">PRESS SPIN</div>
<div class="song-cn-artist" id="artistCN">&nbsp;</div>
<div class="song-year" id="year">&nbsp;</div>
</div>
</div>
<div class="cal-view show" id="calView">
<div class="cal-date" id="calDate"></div>
<div class="cal-day" id="calDay">--</div>
<div class="cal-month" id="calMonth">---</div>
<div class="cal-quote-wrap">
<div class="cal-quote" id="calQuote">—</div>
</div>
<div class="cal-from" id="calFrom">—</div>
<div class="cal-from-cn" id="calFromCN">—</div>
</div>
<div class="test-view" id="testView">
<div id="testInner"></div>
</div>
</div>

<div class="cl">
<button class="sp" id="sb">REFRESH</button>
<div class="ar">
<button class="ab" id="nb" disabled>网易云</button>
<button class="ab" id="lb" disabled>歌曲信息</button>
<button class="ab" id="shb" disabled>生成卡片</button>
</div>
</div>

<footer class="ft">SIDE B · A LYRIC FOR TODAY</footer>

</div>

</div>

else if(v===2)i=`<circle cx="50" cy="50" r="32" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.4"/><path d="M 50 18 A 32 32 0 0 1 50 82 A ${20+h2%12} 32 0 0 0 50 18" fill="${c1}" opacity="0.7"/>`;

function scoreLabel(scores){
return TEST_DIMS.map(d=>[d,scores[d]||0]).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]+' '+x[1]).join(' / ');
}

function pickTestResult(){
let best=TEST_RESULTS[0],bestScore=-1;
TEST_RESULTS.forEach(r=>{
let total=0;
Object.keys(r.w).forEach(k=>{total+=(testScores[k]||0)*r.w[k];});
if(total>bestScore){bestScore=total;best=r;}
});
return best;
}

function fitText(ctx,text,maxWidth,baseFontSize,fontFamily,minFontSize){
let fontSize=baseFontSize;
while(fontSize>=minFontSize){
ctx.font=`500 ${fontSize}px ${fontFamily}`;
if(ctx.measureText(text).width<=maxWidth)return fontSize;
fontSize-=2;
}
return minFontSize;
}

function wrapText(ctx,text,maxWidth){
const isCN=/[\u4e00-\u9fa5]/.test(text);
const lines=[];
if(isCN){
let cur='';
for(let ch of text){
const test=cur+ch;
if(ctx.measureText(test).width>maxWidth&&cur){lines.push(cur);cur=ch;}
else cur=test;
}
if(cur)lines.push(cur);
}else{
const words=text.split(' ');
let cur='';
for(let w of words){
const test=cur?cur+' '+w:w;
if(ctx.measureText(test).width>maxWidth&&cur){lines.push(cur);cur=w;}
else cur=test;
}
if(cur)lines.push(cur);
}
return lines;
}

function wrapTextClean(ctx,text,maxWidth){
const lines=wrapText(ctx,text,maxWidth);
const bad=/^[，。！？、：；）》”’]$/;
for(let i=1;i<lines.length;i++){
if(bad.test(lines[i])&&lines[i-1]){
lines[i-1]+=lines[i];
lines.splice(i,1);
i--;
}
}
return lines;
}

function fitWrappedLines(ctx,text,maxWidth,maxLines,baseFontSize,fontFamily,minFontSize,weight='400'){
let fontSize=baseFontSize;
let lines=[];
while(fontSize>=minFontSize){
ctx.font=`${weight} ${fontSize}px ${fontFamily}`;
lines=wrapTextClean(ctx,text,maxWidth);
if(lines.length<=maxLines)return {fontSize,lines};
fontSize-=2;
}
return {fontSize:minFontSize,lines:lines.slice(0,maxLines)};
}
