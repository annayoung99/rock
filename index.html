<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:#000;color:#e8e8e8;font-family:'Noto Sans SC',-apple-system,sans-serif;user-select:none;position:relative;overflow-x:hidden;font-weight:300}

.c{position:relative;z-index:2;min-height:100vh;padding:24px 18px 30px;display:flex;flex-direction:column;max-width:480px;margin:0 auto;width:100%}

.h{text-align:center;margin-bottom:6px;padding-top:6px}
.tag{display:inline-block;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:6px;color:#666;margin-bottom:18px}
.t{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,12vw,68px);line-height:.95;letter-spacing:7px;color:#fff;margin-right:-7px;font-weight:400}
.sb{font-family:'Noto Sans SC',sans-serif;font-size:10px;letter-spacing:5px;color:#666;margin-top:12px;font-weight:300}
.sb .em{color:#888;font-family:'Bebas Neue',sans-serif;letter-spacing:4px;font-size:11px}

.modes{display:flex;justify-content:center;margin:18px 0 0;border-top:1px solid #222;border-bottom:1px solid #222}
.mb{flex:1;padding:13px 4px;background:transparent;color:#666;border:none;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:5px;border-right:1px solid #222;cursor:pointer}
.mb:last-child{border-right:none}
.mb.active{color:#fff;background:rgba(255,255,255,.04)}

.filters{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fp{flex:0 0 auto;padding:6px 14px;background:transparent;color:#888;border:1px solid #333;font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:1px;white-space:nowrap;font-weight:300;cursor:pointer}
.fp.active{color:#000;background:#fff;border-color:#fff;font-weight:400}

.prism-wrap{display:flex;justify-content:center;margin:24px 0 6px;position:relative}
.prism-svg{width:100%;max-width:340px;height:110px}

.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;margin:6px 0;min-height:340px}

.song-card{width:100%;border:1px solid #2a2a2a;padding:24px 18px 22px;text-align:center;background:rgba(0,0,0,.5)}
.cover{width:148px;height:148px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.cover svg{width:100%;height:100%}
.song-title{font-family:'Noto Sans SC',sans-serif;font-weight:500;font-size:clamp(18px,5vw,24px);color:#fff;letter-spacing:1.5px;margin-bottom:8px;line-height:1.25;padding:0 4px;word-break:break-word}
.song-artist{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:4px;color:#bbb;text-transform:uppercase}
.song-cn-artist{font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:2px;color:#888;font-weight:300;margin-top:3px}
.song-year{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:3px;color:#666;margin-top:6px}
.idle .song-title{color:#888;font-weight:300}
.idle .cover{opacity:.5}

.cal-view{display:none;width:100%;border:1px solid #2a2a2a;padding:28px 22px 26px;background:rgba(0,0,0,.5);position:relative}
.cal-view.show{display:block}
.cal-date{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:6px;color:#888;margin-bottom:14px;text-align:center}
.cal-day{font-family:'Bebas Neue',sans-serif;font-size:clamp(78px,22vw,108px);color:#fff;line-height:.85;letter-spacing:-2px;text-align:center}
.cal-month{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:6px;color:#888;margin:10px 0 32px;text-align:center}
.cal-quote-wrap{position:relative;padding:0 4px 0 18px;margin-bottom:24px}
.cal-quote-wrap::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;background:linear-gradient(to bottom,#ff3344,#ff8822,#ffdd33,#22dd66,#33aaff,#aa44ff);border-radius:1px}
.cal-quote{font-family:'Caveat',cursive;font-size:clamp(20px,5.5vw,26px);line-height:1.5;color:#fff;font-weight:500;letter-spacing:0.5px;min-height:48px;text-align:left}
.cal-quote.cn{font-family:'Noto Sans SC',sans-serif;font-style:italic;font-weight:400;font-size:clamp(15px,4.3vw,18px);line-height:1.75;letter-spacing:1px}
.cal-from{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:4px;color:#bbb;margin-bottom:4px;text-align:center;padding-top:6px}
.cal-from-cn{font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:2px;color:#888;font-weight:300;text-align:center}

.cl{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.sp{width:100%;padding:20px;background:transparent;color:#fff;border:1px solid #fff;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:14px;text-indent:14px;cursor:pointer;transition:all .15s}
.sp:active{color:#000;background:#fff}
.sp:disabled{color:#444;border-color:#333}
.ar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ab{padding:13px 4px;background:transparent;color:#aaa;border:1px solid #3a3a3a;font-family:'Noto Sans SC',sans-serif;font-size:12px;letter-spacing:2px;cursor:pointer;font-weight:300}
.ab:active{background:#fff;color:#000;border-color:#fff}
.ab:disabled{color:#333;border-color:#222}

.lm{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(8px)}
.lm.s{display:flex}
.lc{width:100%;max-width:420px;background:#0a0a0a;border:1px solid #333;padding:36px 22px 26px;position:relative;text-align:center}
.lx{position:absolute;top:8px;right:14px;background:none;border:none;color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lt{font-family:'Noto Sans SC',sans-serif;font-size:22px;font-weight:500;color:#fff;margin-bottom:6px}
.la{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:5px;color:#888;margin-bottom:22px}
.lr{font-size:13px;line-height:2;white-space:pre-line;color:#aaa;letter-spacing:1px}

.sm{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column}
.sm.s{display:flex}
.sm canvas{max-width:100%;max-height:72vh;border:1px solid #333}
.sm-hint{margin-top:14px;color:#888;font-family:'Noto Sans SC',sans-serif;font-size:12px;letter-spacing:2px;text-align:center;line-height:1.8;font-weight:300}
.sm-close{position:absolute;top:16px;right:16px;background:none;border:1px solid #444;color:#fff;width:36px;height:36px;font-size:22px;cursor:pointer}

.ft{text-align:center;margin-top:18px;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:6px;color:#444}

@keyframes pulse{0%,100%{opacity:.92}50%{opacity:1}}
.spinning .ray,.spinning .beam{animation:pulse .15s infinite}
@keyframes spin-cover{0%{transform:rotate(0) scale(.9);opacity:.3}100%{transform:rotate(360deg) scale(1);opacity:1}}
.cover.reveal{animation:spin-cover .6s ease-out}
@keyframes fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.song-card.reveal,.cal-view.reveal{animation:fade-in .5s ease-out}

@media (max-width:359px){
.c{padding:18px 14px 24px}
.t{font-size:42px;letter-spacing:5px;margin-right:-5px}
.cover{width:128px;height:128px}
.sp{padding:16px;font-size:22px;letter-spacing:10px;text-indent:10px}
.ab{padding:11px 2px;font-size:11px;letter-spacing:1.5px}
}

@media (min-width:768px) and (max-width:1023px){
.c{max-width:560px;padding-top:50px}
.prism-svg{max-width:400px;height:130px}
.t{font-size:82px;letter-spacing:10px;margin-right:-10px}
.cover{width:172px;height:172px}
}

@media (min-width:1024px){
body{display:flex;align-items:center;justify-content:center;padding:40px 0}
.c{max-width:1100px;flex-direction:row;gap:60px;align-items:stretch;padding:40px}
.left-panel{flex:0 0 480px;display:flex;flex-direction:column;justify-content:center}
.right-panel{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:380px}
.h{text-align:left;margin-bottom:0}
.t{font-size:96px;letter-spacing:14px;margin-right:-14px}
.sb{text-align:left}
.tag{display:block;text-align:left}
.modes{margin:30px 0 0;border-top:1px solid #222;border-bottom:none;border-right:none}
.mb{flex:0 0 auto;padding:11px 28px;border:1px solid #2a2a2a;margin-right:-1px;border-radius:0}
.filters{padding-top:18px;justify-content:flex-start}
.prism-wrap{margin:50px 0 0;justify-content:flex-start}
.prism-svg{max-width:420px;height:150px}
.stage-wrap{min-height:auto;margin:0}
.cover{width:200px;height:200px}
.song-title{font-size:30px}
.cal-day{font-size:140px}
.ft{text-align:left;padding-top:24px}
}

let pool='all',curPoolSongs=S,cur=null,sp=false,mode='roulette';
function applyPool(){curPoolSongs=pool==='all'?S:S.filter(s=>s[3]===pool);if(curPoolSongs.length===0)curPoolSongs=S;}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}
const COL=['#ff3344','#ff8822','#ffdd33','#22dd66','#33aaff','#aa44ff'];
function isLatin(s){return /^[\x00-\x7F\s'.,&!?\-]+$/.test(s);}

function gen(t,a){
const h1=hash(a),h2=hash(t),c1=COL[h1%6],c2=COL[(h1+3)%6],v=(h1+h2)%6;
let i='';
if(v===0)i=`<polygon points="50,20 76,72 24,72" fill="none" stroke="${c1}" stroke-width="1"/><line x1="12" y1="50" x2="50" y2="50" stroke="#fff" stroke-width="0.8"/><line x1="60" y1="50" x2="90" y2="38" stroke="${c1}" stroke-width="0.8"/><line x1="60" y1="50" x2="92" y2="50" stroke="${c2}" stroke-width="0.8"/><line x1="60" y1="50" x2="90" y2="62" stroke="${COL[(h1+5)%6]}" stroke-width="0.8"/>`;
else if(v===1){let r='';for(let k=0;k<5;k++){r+=`<circle cx="50" cy="50" r="${38-k*7}" fill="none" stroke="${c1}" stroke-width="0.5" opacity="${0.9-k*0.12}"/>`;}r+=`<circle cx="50" cy="50" r="3" fill="${c2}"/>`;i=r;}
else if(v===2)i=`<circle cx="50" cy="50" r="32" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.4"/><path d="M 50 18 A 32 32 0 0 1 50 82 A ${20+h2%12} 32 0 0 0 50 18" fill="${c1}" opacity="0.7"/>`;
else if(v===3)i=`<line x1="18" y1="50" x2="82" y2="50" stroke="${c1}" stroke-width="0.5" opacity="0.6"/><line x1="50" y1="18" x2="50" y2="82" stroke="${c1}" stroke-width="0.5" opacity="0.6"/><line x1="28" y1="28" x2="72" y2="72" stroke="${c2}" stroke-width="0.5" opacity="0.4"/><line x1="28" y1="72" x2="72" y2="28" stroke="${c2}" stroke-width="0.5" opacity="0.4"/><circle cx="50" cy="50" r="5" fill="${c1}"/><circle cx="30" cy="30" r="1.2" fill="#fff"/><circle cx="70" cy="30" r="1.2" fill="#fff"/><circle cx="30" cy="70" r="1.2" fill="#fff"/><circle cx="70" cy="70" r="1.2" fill="#fff"/>`;
else if(v===4){let p1='M 15 50',p2='M 15 60',p3='M 15 40';for(let x=15;x<=95;x+=5){let y1=50+8*Math.sin((x+h2%20)/6);let y2=60+5*Math.sin((x+h2%15)/5+1);let y3=40+5*Math.sin((x+h2%15)/5+2);p1+=` L ${x} ${y1}`;p2+=` L ${x} ${y2}`;p3+=` L ${x} ${y3}`;}i=`<path d="${p1}" fill="none" stroke="${c1}" stroke-width="0.8"/><path d="${p2}" fill="none" stroke="${c2}" stroke-width="0.6" opacity="0.7"/><path d="${p3}" fill="none" stroke="${c2}" stroke-width="0.6" opacity="0.7"/>`;}
else i=`<rect x="28" y="28" width="44" height="44" fill="none" stroke="${c1}" stroke-width="0.8" transform="rotate(${h2%45} 50 50)"/><rect x="34" y="34" width="32" height="32" fill="none" stroke="${c2}" stroke-width="0.8" transform="rotate(${-(h2%30)} 50 50)"/><circle cx="50" cy="50" r="5" fill="${c1}"/>`;
return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#000"/>${i}<rect x="0" y="0" width="100" height="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></svg>`;
}

}
},180+slow*80);
}
},80);
}

function fitText(ctx,text,maxWidth,baseFontSize,fontFamily,minFontSize){
let fontSize=baseFontSize;
while(fontSize>=minFontSize){
ctx.font=`500 ${fontSize}px ${fontFamily}`;
if(ctx.measureText(text).width<=maxWidth)return fontSize;
fontSize-=2;
}
return minFontSize;
}

function wrapText(ctx,text,maxWidth){
const isCN=/[\u4e00-\u9fa5]/.test(text);
const lines=[];
if(isCN){
let cur='';
for(let ch of text){
const test=cur+ch;
if(ctx.measureText(test).width>maxWidth&&cur){lines.push(cur);cur=ch;}
else cur=test;
}
if(cur)lines.push(cur);
}else{
const words=text.split(' ');
let cur='';
for(let w of words){
const test=cur?cur+' '+w:w;
if(ctx.measureText(test).width>maxWidth&&cur){lines.push(cur);cur=w;}
else cur=test;
}
if(cur)lines.push(cur);
}
return lines;
}

const qrX=W-qrSize-40;
const qrY=H-qrSize-50;
ctx.fillStyle='#fff';
ctx.fillRect(qrX-6,qrY-6,qrSize+12,qrSize+12);
if(qrCanvas){
ctx.drawImage(qrCanvas,qrX,qrY,qrSize,qrSize);
}else{
ctx.fillStyle='#000';ctx.font='10px sans-serif';
ctx.fillText('QR',qrX+qrSize/2,qrY+qrSize/2);
}
// 二维码下方文字
ctx.fillStyle='#666';ctx.font='300 11px "Noto Sans SC", sans-serif';ctx.textAlign='center';
ctx.fillText('扫码 ROLL 一首',qrX+qrSize/2,qrY+qrSize+22);

// 左下角品牌
ctx.textAlign='left';
ctx.fillStyle='#888';ctx.font='400 18px "Bebas Neue", Impact, sans-serif';
ctx.fillText('OFFBEAT',40,H-90);
ctx.fillStyle='#555';ctx.font='300 12px "Noto Sans SC", sans-serif';
ctx.fillText('日 常 出 逃',40,H-68);
ctx.fillStyle='#444';ctx.font='300 10px "Noto Sans SC", sans-serif';
ctx.fillText('SIDE B · 跳出日常看日常',40,H-50);

sm.classList.add('s');
});
smClose.addEventListener('click',()=>sm.classList.remove('s'));
sm.addEventListener('click',e=>{if(e.target===sm)sm.classList.remove('s');});
